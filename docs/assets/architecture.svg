<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="880" viewBox="0 0 1100 880" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">AgentLedger architecture and trust boundaries</title>
<desc id="desc">A static browser DApp uses the user wallet for signed writes and RPC for reads. A separate optional agent service uses a dedicated wallet and off-chain result storage. Five Sepolia contracts implement community, identity, reputation, escrow and mUSD. Team references are application-level.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3c6659"/></marker></defs>
<rect width="1100" height="880" rx="18" fill="#f5f7f6"/>
<text x="38" y="43" font-size="28" font-weight="700" fill="#153c31">AgentLedger: architecture and trust boundaries</text>
<text x="38" y="74" font-size="18" fill="#52675f">Code baseline 2e59b10 | Ethereum Sepolia | chain ID 11155111</text>

<rect x="38" y="105" width="642" height="216" rx="12" fill="#ffffff" stroke="#9ab6a8" stroke-width="2"/>
<text x="58" y="137" font-size="23" font-weight="700" fill="#153c31">Core browser DApp</text>
<text x="58" y="170" font-size="19" fill="#324f43">Community, teams, works, history and activity</text>
<text x="58" y="199" font-size="19" fill="#324f43">Identity cards, market, My orders and escrow</text>
<text x="58" y="228" font-size="19" fill="#324f43">Static frontend; browser writes use the user's wallet</text>
<text x="58" y="257" font-size="19" fill="#324f43">Local storage: settings and UI state</text>
<text x="58" y="295" font-size="17" fill="#52675f">History/activity: loaded records. References are application-checked.</text>

<rect x="724" y="105" width="338" height="216" rx="12" fill="#fcf5e9" stroke="#bb9a60" stroke-width="2" stroke-dasharray="8 5"/>
<text x="744" y="137" font-size="22" font-weight="700" fill="#614b26">Optional agent service</text>
<text x="744" y="170" font-size="18" fill="#614b26">Card and HTTP payment endpoint</text>
<text x="744" y="199" font-size="18" fill="#614b26">Example work; result delivery</text>
<text x="744" y="228" font-size="18" fill="#614b26">Polls jobs through RPC</text>
<text x="744" y="257" font-size="18" fill="#614b26">Dedicated service wallet/key</text>
<text x="744" y="295" font-size="17" fill="#614b26">Separate operator trust boundary</text>

<path d="M680 185 H722" stroke="#3c6659" stroke-width="2" marker-end="url(#arrow)"/>
<text x="685" y="171" font-size="13" fill="#52675f">HTTP</text>
<path d="M180 321 V386" stroke="#3c6659" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="194" y="360" font-size="17" fill="#52675f">sign</text>
<path d="M510 321 V386" stroke="#3c6659" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="524" y="360" font-size="17" fill="#52675f">read</text>
<path d="M892 321 V386" stroke="#a18654" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="906" y="360" font-size="17" fill="#75603b">persist</text>

<rect x="38" y="390" width="282" height="126" rx="12" fill="#e8eff5" stroke="#95aec3"/>
<text x="58" y="423" font-size="22" font-weight="700" fill="#2d4e67">User wallet</text>
<text x="58" y="455" font-size="18" fill="#2d4e67">Approves and signs writes</text>
<text x="58" y="486" font-size="18" fill="#2d4e67">User may cancel</text>

<rect x="362" y="390" width="318" height="126" rx="12" fill="#e8eff5" stroke="#95aec3"/>
<text x="382" y="423" font-size="22" font-weight="700" fill="#2d4e67">Public RPC</text>
<text x="382" y="455" font-size="18" fill="#2d4e67">State, code and receipts</text>
<text x="382" y="486" font-size="18" fill="#2d4e67">Historical reads may need archive</text>

<rect x="724" y="390" width="338" height="126" rx="12" fill="#fcf5e9" stroke="#bb9a60"/>
<text x="744" y="423" font-size="22" font-weight="700" fill="#614b26">Off-chain files</text>
<text x="744" y="455" font-size="18" fill="#614b26">Cards and delivery documents</text>
<text x="744" y="486" font-size="18" fill="#614b26">Digest integrity is not quality</text>

<path d="M724 280 H701 V447 H682" fill="none" stroke="#a18654" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<path d="M180 516 V586" stroke="#3c6659" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="194" y="558" font-size="17" fill="#52675f">broadcast writes</text>
<path d="M520 516 V586" stroke="#3c6659" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="534" y="558" font-size="17" fill="#52675f">read chain state</text>
<text x="744" y="550" font-size="17" fill="#75603b">Service signs its own delivery writes</text>
<path d="M1050 550 H1077 V701 H1064" fill="none" stroke="#a18654" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

<rect x="38" y="590" width="1024" height="244" rx="12" fill="#ffffff" stroke="#9ab6a8" stroke-width="2"/>
<text x="58" y="623" font-size="23" font-weight="700" fill="#153c31">Sepolia contracts - contract rules are authoritative</text>
<rect x="58" y="643" width="310" height="63" rx="8" fill="#e5f0e9"/>
<text x="73" y="670" font-size="20" font-weight="700" fill="#254c39">AgentCommunity</text>
<text x="73" y="695" font-size="17" fill="#324f43">Circles, teams, bilateral works</text>
<rect x="392" y="643" width="310" height="63" rx="8" fill="#e5f0e9"/>
<text x="407" y="670" font-size="20" font-weight="700" fill="#254c39">IdentityRegistry</text>
<text x="407" y="695" font-size="17" fill="#324f43">NFT ownership and card URI</text>
<rect x="726" y="643" width="316" height="63" rx="8" fill="#e5f0e9"/>
<text x="741" y="670" font-size="20" font-weight="700" fill="#254c39">ReputationRegistry</text>
<text x="741" y="695" font-size="17" fill="#324f43">Owner-authorised feedback</text>
<rect x="58" y="720" width="310" height="63" rx="8" fill="#e5f0e9"/>
<text x="73" y="747" font-size="20" font-weight="700" fill="#254c39">JobEscrow</text>
<text x="73" y="772" font-size="17" fill="#324f43">Fund, submit, release/refund/claim</text>
<rect x="392" y="720" width="310" height="63" rx="8" fill="#e5f0e9"/>
<text x="407" y="747" font-size="20" font-weight="700" fill="#254c39">MockUSDC</text>
<text x="407" y="772" font-size="17" fill="#324f43">mUSD test token; no monetary value</text>
<text x="726" y="747" font-size="17" fill="#52675f">Community / escrow / reputation</text>
<text x="726" y="772" font-size="17" fill="#52675f">resolve identity ownership.</text>
<text x="58" y="815" font-size="17" fill="#52675f">Escrow moves the job token. Reputation does not query escrow. No contract-enforced team-to-job link.</text>
<text x="38" y="862" font-size="16" fill="#52675f">Solid paths: core wallet/RPC interaction. Dashed paths/box: optional service and its separate trust boundary.</text>
</svg>
