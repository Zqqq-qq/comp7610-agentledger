name: Development task
description: 记录范围、验收条件与交接负责人
title: "[Task] "
body:
  - type: dropdown
    id: area
    attributes:
      label: 负责模块
      options:
        - A - 社区界面
        - B - 社区合约
        - C - 钱包与部署
        - D - 测试与质量
        - E - 报告与演示
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 问题与交付范围
      description: 说明当前行为、目标行为及本任务涉及的文件。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      value: "- [ ] 可复现的结果\n- [ ] 测试或演示证据\n- [ ] 相关说明已更新"
    validations:
      required: true
  - type: input
    id: due
    attributes:
      label: 目标日期（Asia/Shanghai）
      placeholder: 2026-11-03
