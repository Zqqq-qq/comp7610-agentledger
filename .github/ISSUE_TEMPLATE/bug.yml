name: Bug report
description: 记录可复现问题，避免群聊里丢失缺陷
title: "[Bug] "
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 写明浏览器、Demo/Sepolia 模式、账户角色；不要放私钥或签名原文。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与预期结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、合约地址、交易哈希或日志
